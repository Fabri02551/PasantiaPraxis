services:
  db:
    image: postgres:16-alpine
    container_name: praxis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./praxis-crm-BE/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  etl-init:
    build:
      context: ./praxis-crm-BE/Etl
      dockerfile: Dockerfile
    container_name: praxis-etl-init
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ETL_SRC_DIR: ${ETL_SRC_DIR}
      ETL_EVERY: ${ETL_EVERY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  api:
    build:
      context: ./praxis-crm-BE/Api
      dockerfile: Dockerfile
    container_name: praxis-api
    restart: unless-stopped
    expose:
      - "${API_PORT}"
    environment:
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      SMTP_ENCRYPTION: "${SMTP_ENCRYPTION}"
      API_PORT: ${API_PORT}
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
    depends_on:
      db:
        condition: service_healthy
      etl-init:
        condition: service_completed_successfully
    networks:
      - default

  web:
    build:
      context: ./praxis-crm-FR
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL}
    container_name: praxis-web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_started
    networks:
      - default
      - dokploy-network

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
