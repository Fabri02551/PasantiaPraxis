# ============================================================
# Producción (dokploy) y local. Los VALORES no van acá: todo sale de
# ${...} y se interpola desde el archivo .env
#   - local: .env de la raíz del repo (no se commitea)
#   - dokploy: pestaña Environment del servicio, que escribe el .env en el
#     servidor antes de levantar. Así la contraseña de la base, el JWT y el
#     SMTP no quedan en el repo ni en el historial de git.
#
# Los críticos usan ${VAR:?Falta VAR}: si falta alguno el deploy FALLA AL
# TOPE con el nombre de la variable en vez de levantar medio a oscuras.
#
# Ningún servicio publica puertos en el host: traefik llega a "web" por la
# red dokploy-network (expose es solo metadata interna, no abre nada).
# Los ajustes SOLO locales (puertos de host + TLS con certs) están en
# docker-compose.override.yml, que no se sube al repo.
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: praxis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    # Sin puertos publicados: la base solo se usa por la red interna.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./praxis-crm-BE/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  etl-init:
    build:
      context: ./praxis-crm-BE/Etl
      dockerfile: Dockerfile
    container_name: praxis-etl-init
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL}
      ETL_SRC_DIR: ${ETL_SRC_DIR:-/app/src}
      ETL_EVERY: ${ETL_EVERY:-24h}
      # SMTP con el que el ETL manda las credenciales de los usuarios que
      # crea (visitadores nuevos + la cuenta admin sembrada). Si SMTP_HOST
      # queda vacío no se manda nada.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-ssl}
      # Cuenta administradora que siembra el ETL y casilla que recibe copia
      # de las credenciales nuevas. Vacío = no siembra ni manda copia.
      ETL_ADMIN_EMAIL: ${ETL_ADMIN_EMAIL:-}
      APP_URL: ${APP_URL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  api:
    build:
      context: ./praxis-crm-BE/Api
      dockerfile: Dockerfile
    container_name: praxis-api
    restart: unless-stopped
    expose:
      - "${API_PORT:-8080}"
    environment:
      API_PORT: ${API_PORT:-8080}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-12}
      # SMTP con el que la API manda las credenciales de los usuarios que
      # crea desde el panel (visitadores y administradores): el formulario
      # no pide contraseña, la genera el backend y la envía por correo.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-ssl}
      APP_URL: ${APP_URL:-}
    depends_on:
      db:
        condition: service_healthy
      etl-init:
        condition: service_completed_successfully
    networks:
      - default

  web:
    build:
      context: ./praxis-crm-FR
      dockerfile: Dockerfile
      args:
        # Ruta relativa: el frontend llama a /api y el nginx hace de proxy
        # hacia la API (mismo dominio, sin contenido mixto).
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:?Falta VITE_MAP_TILE_URL}
    container_name: praxis-web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_started
    networks:
      - default
      - dokploy-network

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
