services:
  db:
    image: postgres:16-alpine
    container_name: praxis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: praxis_crm
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./praxis-crm-BE/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis -d praxis_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./praxis-crm-BE/Api
      dockerfile: Dockerfile
    container_name: praxis-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      API_PORT: "8080"
      APP_ENV: development
      DATABASE_URL: postgres://praxis:praxis_secret@db:5432/praxis_crm?sslmode=disable
      JWT_SECRET: change-me-in-production
      JWT_EXPIRATION_HOURS: "24"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./praxis-crm-FR
      dockerfile: Dockerfile
    container_name: praxis-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:443"
    volumes:
      # Solo lectura: el nginx solo necesita leer el par cert/key.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
