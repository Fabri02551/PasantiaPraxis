# TLS local. Este archivo NO se copia en la imagen: lo monta
# docker-compose.override.yml (que no se commitea) en /etc/nginx/conf.d/ssl.conf.
# En producción dokploy termina el TLS y el nginx queda solo en el 80, así que
# allí este bloque no existe.
#
# Por qué HTTPS: la API de geolocalización del navegador solo se entrega en
# contexto seguro (HTTPS o localhost). Al entrar por IP —por ejemplo el
# celular en la misma red— hace falta el TLS. Los certs salen de
# scripts/dev-certs.sh (mkcert) y viven en certs/ (montados en el contenedor).
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/praxis.crt;
    ssl_certificate_key /etc/nginx/certs/praxis.key;

    # La CA local de mkcert ya está en el trust store, así que el navegador
    # no muestra cartel de advertencia.
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTP plano contra el puerto TLS (p. ej. http://localhost:3000, que mapea
    # al 443): nginx lo corta con 497. En vez del "400 Bad Request" lo mandamos
    # a la misma URL por https. Va con $http_host (y no $host) para conservar
    # el puerto: si no, http://localhost:3000 terminaría en https://localhost/.
    error_page 497 =301 https://$http_host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Proxy a la API interna
    location /api/ {
        proxy_pass http://praxis-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck hacia la API
    location = /health {
        proxy_pass http://praxis-api:8080;
        proxy_set_header Host $host;
    }

    # El punto de entrada nunca se cachea (garantiza cargar bundles actualizados)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # Rutas SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets inmutables con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
