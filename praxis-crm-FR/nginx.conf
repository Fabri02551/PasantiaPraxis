# TLS con mkcert.
#
# El GPS del visitador necesita un contexto seguro: la API de geolocalización
# del navegador solo se entrega en HTTPS o en localhost. Por eso el 80 redirige
# al 443 en lugar de servir la app: entrar por http:// haría que el navegador
# niegue el permiso de ubicación sin avisar.
#
# Los certificados salen de `scripts/dev-certs.sh`, que además instala la CA
# local de mkcert en el trust store del sistema y del navegador. Están montados
# de solo lectura; si el directorio certs/ no existe, hay que correr ese
# script antes de levantar.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/praxis.crt;
    ssl_certificate_key /etc/nginx/certs/praxis.key;

    # El certificado de mkcert cubre el CN del servidor, así que los navegadores
    # lo aceptan sin warning una vez instalada la CA local.
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTP plano contra el puerto TLS (p. ej. http://IP:3000, que mapea al 443
    # del contenedor): nginx lo corta con 497. En vez de la página "400 Bad
    # Request", lo mandamos a la misma URL por https.
    error_page 497 =301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Las coordenadas del visitador viajan en el cuerpo de la visita, no en
    # query strings, pero el tamaño por defecto de nginx (1m) igual alcanza
    # holgadamente para el snapshot del destino.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://praxis-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://praxis-api:8080;
        proxy_set_header Host $host;
    }

    location = /index.html {
        # El punto de entrada NUNCA se cachea: Vite cambia el hash del bundle
        # en cada build y si el navegador conserva un index.html viejo, la app
        # queda corriendo código obsoleto (ej. alerts nativos ya eliminados).
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
