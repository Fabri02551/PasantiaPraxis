# OJO: este archivo NO es el nginx.conf principal. Se copia a
# /etc/nginx/conf.d/default.conf, asi que lo que hay adentro es un
# server block que el include principal ya envuelve en "http { }".

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- DNS de Docker ---
    # Esto NO es opcional, es lo que hace que el front sobreviva a un
    # failover. docker/failover.sh recrea el contenedor de la api
    # ("docker compose up -d --no-deps api backup") y el recreado suele
    # cambiar de IP.
    #
    # Con un "proxy_pass http://api:8080" normal, nginx resuelve "api"
    # UNA sola vez al arrancar y se queda con esa IP para siempre. Tras
    # el primer failover esa IP ya no existe y TODO el front devuelve
    # 502 sin que nada diga por que.
    #
    # Al meter el destino en una variable, nginx no puede resolverlo en
    # el arranque y lo re-resuelve en cada pedido contra el DNS
    # embebido de Docker (127.0.0.11). Coste: una consulta DNS por
    # request, en el loopback, irrelevante.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # --- proxy hacia la API ---
    # El front llama a rutas relativas ("/api/..."), asi que navegador
    # y API quedan en la MISMA ORIGEN: no hay CORS y la URL del backend
    # nunca queda escrita en el bundle.
    location /api/ {
        # $request_uri reenvia ruta y query string tal cual, asi que
        # /api/ciudades?foo=1 llega al backend como /api/ciudades?foo=1.
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sin "Upgrade" porque no hay websockets en este proyecto; con
        # Connection vacio se reutilizan las conexiones al upstream.
        proxy_set_header Connection        "";

        # Si la API esta caida se responde rapido con error, en vez de
        # dejar el request colgado hasta que el navegador se rinda.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # La API devuelve errores con cuerpo JSON propio, no con la
        # pagina de error de nginx: se le pasa todo tal cual.
        proxy_intercept_errors off;
    }

    # --- salud del propio nginx ---
    # Para el healthcheck de compose. No consulta la API a proposito:
    # si la API esta caida el front sigue sirviendo la SPA, asi que
    # reportar "unhealthy" por eso seria mentir.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- la SPA ---
    # /login, /visitador/home, etc. no existen como archivos en disco:
    # se devuelve index.html y el router del lado del cliente resuelve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre (index-BjFYuvVt.js),
    # asi que si cambian de contenido cambia el nombre: se pueden
    # cachear para siempre sin riesgo de servir un version vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # index.html en cambio NO se cachea: es el unico archivo que apunta
    # a los assets con hash. Si se cachea, un deploy nuevo sigue
    # pidiendo el bundle viejo y la app se rompe sola.
    #
    # Este bloque es de hecho el que sirve TODA la SPA: pedir "/" cae
    # aca por el try_files de arriba, que hace un redirect interno y
    # vuelve a evaluar el matching de locations. Por eso tiene que
    # repetir los headers de seguridad completos, porque nginx no
    # hereda los del server en cuanto un location define sus propio
    # add_header. Por eso Referrer-Policy esta repetido aqui y no solo
    # arriba.
    location = /index.html {
        add_header Cache-Control           "no-cache";
        add_header X-Content-Type-Options nosniff                          always;
        add_header X-Frame-Options        SAMEORIGIN                        always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # --- gzip ---
    # Sin esto el bundle de ~405 kB viaja sin comprimir.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain
                    text/css
                    text/javascript
                    application/javascript
                    application/json
                    application/xml
                    image/svg+xml
                    font/woff
                    font/woff2;

    # --- headers de seguridad ---
    # OJO con add_header: nginx NO hereda estos headers en los bloques
    # que tengan su propio add_header (los de arriba repiten los
    # necesarios por eso, no es descuido).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
}
