# En cada push sube el bundle web a Capgo (OTA) y genera el APK para GitHub Releases.
name: Build, OTA Update (Capgo) y APK Release

on:
  push:
    branches: [Dev, main]

jobs:
  capgo-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: praxis-crm-FR/package-lock.json

      - name: Instalar dependencias
        working-directory: praxis-crm-FR
        run: npm ci

      # 1. Compilación web para Android
      - name: Build web (modo android)
        working-directory: praxis-crm-FR
        run: npm run build:android

      # 2. Subida OTA a Capgo
      - name: Subir bundle a Capgo
        working-directory: praxis-crm-FR
        run: >
          npx @capgo/cli@latest bundle upload com.laboratoriopraxis.crm
          --path ./dist
          --channel production
          --auto-bump
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}

      # 3. Sincronizar bundle web compilado dentro del proyecto nativo Android
      - name: Capacitor Sync Android
        working-directory: praxis-crm-FR
        run: npx cap sync android

      # 4. Configurar Java para compilar la app de Android
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 5. Generar el Tag y Nombre de Versión dinámico
      - name: Generar Tag y Nombre de Versión
        id: vars
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      # 6. Restaurar keystore de release desde secrets (si existen)
      - name: Restaurar keystore de release
        working-directory: praxis-crm-FR/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Sin secrets de keystore: se compila debug sin firma release."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > praxis-release.jks
          printf 'storeFile=../praxis-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KS_ALIAS" "$KS_KEYPASS" > app/keystore.properties

      # 7. Compilar el APK con Gradle (release si hay keystore, si no debug)
      - name: Compilar APK
        id: apk
        working-directory: praxis-crm-FR/android
        run: |
          chmod +x gradlew
          if [ -f app/keystore.properties ]; then
            ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.vars.outputs.version }}
            echo "apk=praxis-crm-FR/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=${{ steps.vars.outputs.version }}
            echo "apk=praxis-crm-FR/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      # 8. Crear el Release en GitHub y adjuntar el APK
      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          body: |
            Actualización automática generada desde la rama `${{ github.ref_name }}`.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
